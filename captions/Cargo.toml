[package]
name = "maprisma-video-translator-captions"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maprisma Video Translator's caption window on COSMIC: an overlay layer above all windows, fullscreen video too"

[dependencies]
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "net"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["dbus-config", "multi-window", "tokio", "wayland", "winit"]
