[package]
name = "maprisma-video-translator-applet"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet for Maprisma Video Translator: start and stop live translated captions"

[dependencies]
maprisma-video-translator-control = { path = "../control" }
serde_json = "1"
libc = "0.2"
png = "0.18"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "net"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# The revision COSMIC's own applets (cosmic-applets 1.11) are built against.
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]
